name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check voidscan tests scripts
          ruff format --check voidscan tests scripts

      - name: Type check
        run: mypy

      - name: Tests and coverage
        run: pytest -q --cov

      - name: Per-package coverage
        run: python scripts/check_coverage.py

  package:
    name: Package smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and run the wheel
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install --upgrade pip
          smoke/bin/pip install dist/*.whl
          smoke/bin/voidscan --version
