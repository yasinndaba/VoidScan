[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voidscan"
version = "0.2.0"
description = "Authorized reconnaissance and security assessment toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]
authors = [
    { name = "Yasin Ndaba" }
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.9",
    # Needed to type-check the Python 3.10 tomli fallback on newer
    # interpreters.
    "tomli>=2.0",
]

[project.scripts]
voidscan = "voidscan.cli:main"

[tool.setuptools.packages.find]
include = ["voidscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: requires the real external tools or network access; skipped by default",
]

[tool.coverage.run]
source = ["voidscan"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 79
src = ["voidscan", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    # ScanCancelled and ScanTimeout are part of the public scan API.
    "N818",
]

[tool.mypy]
python_version = "3.10"
files = ["voidscan", "scripts"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
